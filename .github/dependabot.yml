# Dependency updates (#337). Security updates arrive as soon as an advisory is
# published; version updates are weekly and grouped so they do not bury the
# security ones. CI (research-contracts.yml) runs on every pull request, so
# each update is tested before anyone merges it; the `dependency-audit` job
# is what turns a known advisory red.
version: 2
updates:
  - package-ecosystem: npm
    directory: /sentra/frontend
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sentra/eval
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      eval-minor-and-patch:
        update-types: [minor, patch]

  # requirements.txt states intent and requirements.lock.txt is what CI
  # installs (#184). The lock is generated, not hand-edited: before merging a
  # Dependabot PR here, regenerate it with the procedure at the top of
  # requirements.lock.txt so transitive pins match the new resolution.
  - package-ecosystem: pip
    directory: /sentra/backend
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
