name: Crisis notification retries

# Why a workflow and not a Vercel cron.
#
# The retry ceiling that makes the escalation design honest is minutes: an
# undelivered crisis notification is supposed to be *late*, not next-morning.
# Vercel Hobby accounts cannot express that — cron jobs there run at most once a
# day, and `*/5 * * * *` fails the deployment outright with "Hobby accounts are
# limited to daily cron jobs". That limit is why the first push of this manifest
# turned the Vercel check red.
#
# So the schedule lives here, where five minutes is expressible, and
# `sentra/frontend/vercel.json` keeps a daily run of the same endpoint as a
# backstop for the case where this workflow is disabled or the repository is
# archived.
#
# **GitHub's scheduler is best-effort.** Runs are queued, and under load they
# are delayed or dropped entirely — five minutes is a target, not a guarantee.
# Upgrading the Vercel account to Pro and moving the schedule back into
# `vercel.json` is the way to make it one. Until then this is the honest
# arrangement, and `GET /api/safety/dispatch` reports how much is still owed so
# a gap is visible rather than assumed away.

on:
  schedule:
    # Every five minutes — GitHub's documented minimum.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Nothing here touches the repository: no checkout, one `curl` to a deployment.
# So the job is given no repository access at all (#208). It matters more here
# than in the other workflow because this one runs every five minutes with
# `PILOT_BASE_URL` and `SAFETY_DISPATCH_TOKEN` in its environment — the pair
# that can drive the crisis dispatcher — and a job holding secrets should not
# also be holding permissions it has no use for.
permissions: {}

# A queued run is worthless once a newer one exists: they do the same work
# against the same queue.
concurrency:
  group: safety-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Retry undelivered escalations
    runs-on: ubuntu-latest
    steps:
      - name: Call the dispatcher
        env:
          BASE_URL: ${{ secrets.PILOT_BASE_URL }}
          TOKEN: ${{ secrets.SAFETY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          # Skip rather than fail when the deployment has not been wired up yet.
          # A scheduled job that goes red every five minutes teaches everyone to
          # ignore this workflow, which is the opposite of what it is for.
          #
          # But a skip that only echoes is a skip nobody sees: the run is green,
          # the list of runs is green, and the sentence explaining that crisis
          # notifications are not being retried is one click down inside each of
          # 288 identical green runs a day. So it is also written as an
          # annotation and to the run summary, which are what the Actions page
          # actually shows.
          if [ -z "${BASE_URL}" ] || [ -z "${TOKEN}" ]; then
            # `if`, not `[ … ] && …`: under `set -e` a false test at the head of
            # an AND-list is a non-zero command, and the job this block exists
            # to keep green would go red on the branch where only one secret is
            # missing.
            missing=""
            if [ -z "${BASE_URL}" ]; then missing="PILOT_BASE_URL"; fi
            if [ -z "${TOKEN}" ]; then missing="${missing:+${missing}, }SAFETY_DISPATCH_TOKEN"; fi

            echo "::warning title=Crisis-notification retries are not running::Repository secret(s) missing: ${missing}. Escalations whose first delivery failed stay undelivered."
            {
              echo "### 危機通知の再送は走っていません"
              echo
              echo "未設定の repository secret: \`${missing}\`"
              echo
              echo "初回送信に失敗した escalation は、誰にも届かないまま残ります。"
              echo "設定手順と確認方法: \`docs/pilot/infrastructure-runbook.md\` §3.4 /"
              echo "\`node scripts/pilot/check-ops-config.mjs --new-secrets\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # `-sS` keeps the body but still reports transport errors; the status
          # code is checked separately so a 403 from a rotated token is loud.
          response="$(mktemp)"
          code="$(curl -sS -o "${response}" -w '%{http_code}' \
            -X POST "${BASE_URL%/}/api/safety/dispatch" \
            -H "authorization: Bearer ${TOKEN}")"

          echo "HTTP ${code}"
          cat "${response}"
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::The dispatcher answered ${code}. Undelivered crisis escalations are not being retried."
            exit 1
          fi

          # What somebody has to act on, as the dispatcher states it.
          #
          # This used to be two shell tests over `stuck` and `pending`, each
          # reading the JSON with `.get(name, 0)`. That substitutes for a key
          # that is **missing**, not for one whose value is `null` — so when #377
          # made `stuck` a `number | null`, an unreadable count arrived as `None`,
          # compared unequal to "0", and raised the warning for the other
          # condition: "escalations have exhausted their retries", when in fact
          # nothing was known about them. `stuck_error`, which says why, was never
          # printed (#453).
          #
          # The three states — none, some, not known — are now decided in
          # `dispatchAttention()`, next to the types, with unit tests. This step
          # prints what it is handed and adds nothing of its own. An empty list is
          # the quiet case, and 288 runs a day is why that has to stay quiet.
          python3 - "${response}" <<'REPORT'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          lines = report.get("attention")
          if not isinstance(lines, list):
              # Reached only against a deployment that predates #453. Said out loud,
              # because the alternative is a green run that checked nothing.
              print(
                  "::warning title=No attention report::The dispatcher answered 200 "
                  "without an `attention` list, so this run did not check for stuck "
                  "or queued escalations. The deployment predates #453."
              )
              sys.exit(0)

          for line in lines:
              print(f"::warning title=Crisis notifications::{line}")
          REPORT
