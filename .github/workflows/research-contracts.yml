name: Research Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

# Every job here checks out, runs tests, and uploads artifacts. None of that
# needs the token to be able to write: artifact upload authenticates against the
# Actions runtime rather than through `GITHUB_TOKEN`. Declared rather than
# inherited (#208), because an inherited default is whatever the repository
# setting happens to be — including read-and-write, which would hand every job
# in this file the ability to push code and move issues it has no use for.
permissions:
  contents: read

jobs:
  eval-contracts:
    name: Synthetic evaluation contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentra/eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sentra/eval/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # Known vulnerabilities in the dependency tree (#337). Nothing in this
      # repository ran `npm audit`, so the only time the answer existed was the
      # day somebody typed it by hand — and on 2026-10-05 that answer was five
      # findings, all reaching this package through
      # `@openai/agents` → `@modelcontextprotocol/sdk`.
      #
      # Everything here is a direct `dependencies` entry or below one, so there
      # is no dev/prod split to make: the gate covers the whole tree.
      #
      # The five are closed by the `overrides` block in `sentra/eval/package.json`
      # (`ip-address`, `fast-uri`, `hono`, `@hono/node-server`, `qs`) rather than
      # by moving `@openai/agents`. Two reasons. Bumping the MCP SDK alone does
      # not do it — forcing `@modelcontextprotocol/sdk` to 1.32.0 still resolved
      # all five, because its own ranges admit the vulnerable versions. And
      # `@openai/agents` is at 0.3.7 against a current 0.18.0; on a 0.x package
      # that is a breaking move, and it would be one made for an advisory in the
      # part of the SDK this runner never touches (it is an MCP *client*, and
      # these are the dependencies of serving). `package.json` cannot hold a
      # comment, so the reasoning is here, beside the step that keeps it true.
      - name: Audit eval dependencies
        run: npm audit --audit-level=high

  backend-research:
    name: Backend research contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentra/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lock file, not `requirements.txt` (#184). Installing the loose file
      # resolved whatever was newest on the day, so a green run could go red
      # with nothing in this repository changing, and no past run could be
      # rebuilt. `requirements.txt` stays the readable statement of intent;
      # this is the set that actually ran.
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run backend research tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests -q

      # The Day 3 acceptance condition, executed rather than described: a fresh
      # checkout runs the documented command with no key, no network and no GPU,
      # and the process exits non-zero if any leakage check in the report is red.
      # `ci.json` is the short configuration - it proves the path, not the
      # science; the numbers to read come from `smoke.json`.
      - name: Run the research engine smoke path
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m research_engine.cli smoke \
            --config research_engine/configs/ci.json \
            --out "${RUNNER_TEMP}/blesc-research-smoke"

      - name: Upload the research run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-run
          path: ${{ runner.temp }}/blesc-research-smoke
          if-no-files-found: warn

      # Printed on every run so a drop in coverage is visible in the log rather
      # than only when someone thinks to look. Deliberately not a gate (#79):
      # there is no distribution to set a threshold against yet, and one chosen
      # before there is would be a number picked to be passed. `if: always()`
      # because a coverage regression is most worth reading on the run where
      # something else also broke.
      - name: Report ontology provenance coverage
        if: always()
        run: PYTHONDONTWRITEBYTECODE=1 USE_MOCK_LLM=true python scripts/report_provenance_coverage.py

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentra/frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kvcrkveaxlrijhzyayeg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sentra/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Known vulnerabilities in what this deployment actually serves (#337).
      #
      # `--omit=dev` rather than the whole tree, and the reason is not
      # convenience. On 2026-10-05 the tree held one critical — RCE in
      # `next/og` ImageResponse, GHSA-vcvr-r3jv-pc5j, fixed in 16.3.6 — and
      # five highs. The critical was in `next` and is gone. **All five highs
      # are one chain** (`braces` → `micromatch` → `fast-glob` →
      # `@next/eslint-plugin-next` → `eslint-config-next`), they are
      # devDependencies that never enter a bundle, and `braces` has no fixed
      # release: 3.0.3 is both the latest version and inside the advisory's
      # range. The only thing `npm audit fix --force` offers is
      # `eslint-config-next@14.2.35` — two majors back, dropping the rules
      # written for `next@16`. That is not a fix.
      #
      # So a gate on the whole tree would be a gate that cannot go green, and a
      # check that is expected to be red stops being read. This one gates on
      # the shipped surface, where the honest answer today is zero, and the step
      # below prints the rest so the dev-side findings are still visible in the
      # log rather than discovered by hand again.
      - name: Audit shipped frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      # Not a gate, deliberately: see above. `|| true` because `npm audit`
      # exits non-zero whenever it finds anything at all.
      - name: Report all frontend advisories
        if: always()
        run: npm audit || true

      - name: Run frontend lint
        run: npm run lint

      # `next build` only typechecks what is in its build graph, so e2e/ (the
      # #164 enrollment-gate suite), playwright.config.ts and scripts/ were
      # never checked by anything. tsconfig.json already includes them; this
      # runs the check. Placed before the tests so a type error stops the job
      # without waiting on the build. `sentra/eval` gates the same way.
      - name: Typecheck frontend
        run: npm run typecheck

      # Includes the Japanese-UI guard (#116): it fails on English text added to
      # a screen without a recorded reason. The suite ran only on developer
      # machines before, so nothing enforced it on a pull request.
      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  supabase-rls:
    name: Supabase RLS contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentra
    steps:
      # The row-level security tests are the only executable statement of who
      # may read a minor's data — consent gating, escalation visibility, the
      # research reader's scope — and until now nothing ran them (#186). They
      # were written, they passed on one laptop, and any migration could have
      # quietly undone them.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local stack
        run: supabase start

      # `db reset` applies every migration from scratch, so this also catches a
      # migration that no longer applies to an empty database — which the
      # frontend tests, running against nothing, cannot see.
      - name: Apply all migrations
        run: supabase db reset --no-seed

      - name: Run the RLS tests
        run: |
          set -euo pipefail
          status=0
          for file in supabase/tests/*.test.sql; do
            echo "--- ${file}"
            # Each script wraps itself in a transaction and rolls back, so they
            # are independent and leave no rows behind. `ON_ERROR_STOP` is what
            # turns a raised assertion into a non-zero exit.
            if ! psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
                 -v ON_ERROR_STOP=1 -q -f "${file}"; then
              echo "FAILED: ${file}"
              status=1
            fi
          done
          exit "${status}"

  pilot-e2e:
    name: Pilot enrollment gate (E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentra/frontend
    steps:
      # #164 built the gate that keeps an unenrolled or withdrawn student out of
      # the collection screen, and wrote the Playwright suite that proves it.
      # Nothing ran it (#195), so the guarantee the pilot rests on was resting
      # on a suite last executed by hand.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sentra/frontend/package-lock.json

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local stack
        working-directory: sentra
        run: supabase start

      - name: Apply all migrations
        working-directory: sentra
        run: supabase db reset --no-seed

      - name: Install frontend dependencies
        run: npm ci

      # Chromium only. The gate is server-side — a layout redirect and a route
      # handler — so a second engine would re-test the same decision at three
      # times the minutes.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The suite builds and serves the app itself (`webServer` in
      # playwright.config.ts) because demo mode is on by default under
      # `next dev`, and demo mode plus a pilot deployment is a combination the
      # collection gate refuses outright.
      - name: Run the enrollment-gate E2E suite
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sentra/frontend/playwright-report
          if-no-files-found: ignore
